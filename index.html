<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The $isty $isters — $ylviya VS $ydney</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#160b35;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
#game{position:relative;width:100vw;height:100vh;background:linear-gradient(#72d9ff 0%,#bcecff 55%,#8bd4a0 100%);overflow:hidden}
#stars{position:absolute;inset:0;pointer-events:none;background-image:
 radial-gradient(circle,#fff 1px,transparent 2px),
 radial-gradient(circle,#ff72c8 1px,transparent 2px);
background-size:90px 90px,130px 130px;background-position:10px 20px,50px 70px;opacity:.55}
#mountain{position:absolute;left:50%;bottom:-8vh;transform:translateX(-50%);
width:72vw;height:82vh;background:linear-gradient(115deg,#53627c,#7786a1 48%,#46546f);
clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 0 25px #4a4a80)}
#mountain:after{content:"";position:absolute;left:50%;top:8%;width:18%;height:92%;transform:translateX(-50%);
background:linear-gradient(90deg,transparent,#9ba9c0aa,transparent);clip-path:polygon(50% 0,100% 100%,0 100%)}
.cloud{position:absolute;background:#fff;border-radius:50px;width:180px;height:45px;opacity:.75}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:65px;height:65px;left:30px;bottom:10px}.cloud:after{width:80px;height:80px;right:25px;bottom:5px}
.c1{left:5%;top:20%}.c2{right:8%;top:29%;transform:scale(.8)}
#hud{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(850px,94vw);
display:flex;justify-content:space-between;align-items:center;z-index:20}
.title{font-weight:900;font-size:clamp(18px,3vw,34px);text-shadow:3px 3px #6d176e,-1px -1px #fff;letter-spacing:1px}
.badge{background:#ff5ca8;border:3px solid #fff;border-radius:16px;padding:8px 13px;font-weight:900;box-shadow:0 4px 0 #8b2a72}
#course{position:absolute;inset:0;z-index:5}
.platform{position:absolute;height:18px;border-radius:7px;border:3px solid #fff;box-shadow:0 4px 0 #6c397e,0 0 12px #ff7bd0;
background:#e958bc}
.platform.alt{background:#ff9b37}.platform.blue{background:#5ee7ff}.platform.green{background:#62e08c}
.girl{position:absolute;width:46px;height:74px;z-index:12;filter:drop-shadow(0 4px 2px #3b1b4f)}
.girl .hair{position:absolute;left:3px;top:1px;width:40px;height:43px;background:#2b1830;border-radius:50% 50% 43% 43%;z-index:1}
.girl .hair:before,.girl .hair:after{content:"";position:absolute;top:19px;width:13px;height:39px;background:#2b1830;border-radius:50%}
.girl .hair:before{left:-5px}.girl .hair:after{right:-5px}
.girl .head{position:absolute;left:10px;top:7px;width:27px;height:31px;background:#f2b28d;border:2px solid #4b244d;border-radius:48% 48% 45% 45%;z-index:2}
.girl .head:after{content:"";position:absolute;left:5px;bottom:5px;width:14px;height:5px;border-bottom:2px solid #7b3450;border-radius:50%}
.girl .eyes{position:absolute;left:6px;top:12px;width:4px;height:5px;background:#25162d;border-radius:50%;box-shadow:10px 0 #25162d}
.girl .body{position:absolute;left:9px;top:36px;width:29px;height:22px;border:2px solid #48234e;border-radius:8px 8px 5px 5px;background:#ff70b3;z-index:2}
.girl .arms{position:absolute;left:5px;top:38px;width:36px;height:20px;border-left:4px solid #f2b28d;border-right:4px solid #f2b28d;border-radius:50%;z-index:3}
.girl .legs{position:absolute;left:12px;top:55px;width:23px;height:19px;border-left:7px solid #29243b;border-right:7px solid #29243b;border-radius:2px;z-index:2}
.girl .legs:after{content:"";position:absolute;left:-5px;top:14px;width:10px;height:5px;background:#1f172d;border-radius:6px;box-shadow:13px 0 #1f172d}
.girl.bot .body{background:#8f63ff}
.girl:before{content:"★";position:absolute;left:-4px;top:4px;font-size:15px;color:#ff4fa5;z-index:6;text-shadow:1px 1px #fff}
.girl.bot:before{content:"★";color:#a36bff}
#message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;width:min(720px,92vw);
background:linear-gradient(135deg,#fff4ff,#ffd5f0);color:#35164b;border:5px solid #ff4fa5;border-radius:28px;
padding:28px;text-align:center;box-shadow:0 12px 0 #7b3277,0 0 40px #fff;display:none}
#message h1{margin:0 0 12px;font-size:clamp(30px,6vw,58px);color:#e73591;text-shadow:2px 2px #fff}
#message p{font-size:18px;line-height:1.45}
button{border:0;border-radius:15px;padding:13px 20px;margin:6px;font-weight:900;font-size:17px;cursor:pointer;
background:#ff4fa5;color:#fff;box-shadow:0 5px 0 #9b276f}
button:hover{transform:translateY(-2px)}
.choice{background:#fff;color:#562064;border:3px solid #c64cba}
#controls{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:12px;align-items:center;background:#ffffff33;padding:8px 10px;border-radius:24px;backdrop-filter:blur(4px)}
.ctrl{width:68px;height:68px;padding:0;border-radius:50%;font-size:29px;background:#fff;color:#51205d;box-shadow:0 6px 0 #a04c9b;touch-action:none;user-select:none}.ctrl:active{transform:translateY(4px);box-shadow:0 2px 0 #a04c9b}.ctrl[data-k=" "]{width:82px;height:82px;font-size:34px;background:#ff5ca8;color:#fff}
#tip{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);z-index:25;background:#54205fdd;padding:7px 12px;border-radius:12px;font-size:14px}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:45;font-size:100px;font-weight:900;color:#fff;text-shadow:0 8px #9b2672}
#progress{position:absolute;top:65px;left:50%;transform:translateX(-50%);z-index:25;width:min(500px,70vw);height:13px;background:#ffffff88;border:2px solid #fff;border-radius:20px;overflow:hidden}
#bar{height:100%;width:0;background:#ff4fa5}

.big-win{font-size:32px;font-weight:1000;color:#e73591;background:#fff;border:4px solid #ff5ca8;border-radius:20px;padding:12px;margin:12px 0;box-shadow:0 6px 0 #9b276f;text-shadow:1px 1px #ffd2ed}.treasure-big{font-size:70px;margin:8px}.petbtn{font-size:20px;min-width:150px}.finish-platform{box-shadow:0 0 22px #ffd34d,0 5px 0 #6c397e}.summitChest{animation:floatChest 1.4s ease-in-out infinite alternate}@keyframes floatChest{from{transform:translateY(0)}to{transform:translateY(-7px)}}
</style>
</head>
<body>
<div id="game">
<div id="stars"></div><div class="cloud c1"></div><div class="cloud c2"></div><div id="mountain"></div>
<div id="hud"><div class="title">⭐ THE $ISTY $ISTERS ⭐</div><div class="badge">$YLVIYA VS $YDNEY</div></div>
<div id="progress"><div id="bar"></div></div>
<div id="course"></div><div id="player" class="girl"><div class="hair"></div><div class="head"><span class="eyes"></span></div><div class="body"></div><div class="arms"></div><div class="legs"></div></div>
<div id="bot" class="girl bot"><div class="hair"></div><div class="head"><span class="eyes"></span></div><div class="body"></div><div class="arms"></div><div class="legs"></div></div>
<div id="tip">← → to run • ↑ or big pink button to jump • You can also use A / D / W</div>
<div id="controls"><button class="ctrl" data-k="ArrowLeft">←</button><button class="ctrl" data-k="ArrowUp">↑</button><button class="ctrl" data-k="ArrowRight">→</button><button class="ctrl" data-k=" ">⤒</button></div>
<div id="count"></div>
<div id="message"></div>
</div>
<script>
const course=document.getElementById('course'), p=document.getElementById('player'), b=document.getElementById('bot');
const msg=document.getElementById('message'), bar=document.getElementById('bar'), count=document.getElementById('count');
let keys={}, running=false, mode=1, selected='Sydney', p1Name='Sydney', p2Name='Sylvia', px=0,py=0,vx=0,vy=0,bx=0,by=0,bvx=0,bvy=0,cam=0,last=0,jump1=false,jump2=false;
let plats=[], startY=0, botProgress=0, winnerName='', chest=null;

function showIntro(){
 msg.style.display='block';
 msg.innerHTML=`<h1>⛰️ MOUNT YAEY ⛰️</h1>
 <p><b>Legend has it...</b> whoever reaches the tippie top wins <b>1 TRILLION DOLLARS</b> and a pet <b>Dolla</b>!<br>Only your great-great-great grandmother has ever completed it.</p>
 <p><b>Sylvia:</b> “I am going to get that prize!”<br><b>Sydney:</b> “NO WAY! I'm going to win!”</p>
 <button onclick="choosePlayers()">START THE STORY ▶</button>`;
}
function choosePlayers(){
 msg.innerHTML=`<h1>👯 HOW MANY PLAYERS?</h1><p>Choose how many people will race up Mount YAEY!</p>
 <button class="choice" onclick="chooseOne()">👤 1 PLAYER</button>
 <button class="choice" onclick="chooseTwo()">👯 2 PLAYERS</button>`;
}
function chooseOne(){
 mode=1;
 msg.innerHTML=`<h1>💗 CHOOSE YOUR SISTER</h1><p>You play as one sister and the other sister becomes your racer.</p>
 <button class="choice" onclick="startGame('Sylvia')">💗 PLAY AS SYLVIA</button>
 <button class="choice" onclick="startGame('Sydney')">💜 PLAY AS SYDNEY</button>`;
}
function chooseTwo(){
 mode=2;
 msg.innerHTML=`<h1>👯 PLAYER 1</h1><p>Who is Player 1?</p>
 <button class="choice" onclick="setP1('Sylvia')">💗 SYLVIA</button>
 <button class="choice" onclick="setP1('Sydney')">💜 SYDNEY</button>`;
}
function setP1(name){
 p1Name=name; p2Name=name==='Sylvia'?'Sydney':'Sylvia';
 msg.innerHTML=`<h1>👯 PLAYER 2</h1><p>Player 2 will be <b>${p2Name}</b>.</p>
 <p><b>Player 1:</b> WASD<br><b>Player 2:</b> Arrow keys</p>
 <button onclick="startTwoPlayer()">START THE RACE ▶</button>`;
}
function startTwoPlayer(){ selected=p1Name; startGame(p1Name); }
function startGame(name){
 selected=name; if(mode===1){p1Name=name;p2Name=name==='Sylvia'?'Sydney':'Sylvia';}
 msg.style.display='none'; makeCourse(); setup(); countdown();
}
function makeCourse(){
 course.innerHTML=''; plats=[]; chest=null;
 const W=window.innerWidth,H=window.innerHeight;
 // More jumps, but every platform is comfortably reachable. The course gradually gets trickier.
 const centers=[.50,.61,.45,.57,.43,.62,.49,.38,.56,.66,.47,.36,.54,.64,.42,.31,.50,.67,.45,.59,.35,.52,.68,.47,.58,.40,.51];
 const widths=[230,205,195,190,184,178,172,168,164,160,156,154,150,148,145,142,140,138,136,134,132,130,128,126,124,122,205];
 centers.forEach((cx,i)=>{
   const y=H-115-i*82;
   const w=Math.max(105,W*widths[i]/1000);
   const x=Math.max(25,Math.min(W-w-25,W*cx-w/2));
   const e=document.createElement('div');
   e.className='platform '+(i%4===0?'alt':i%4===1?'blue':i%4===2?'green':'');
   e.style.left=x+'px';e.style.top=y+'px';e.style.width=w+'px';
   if(i===centers.length-1)e.classList.add('finish-platform');
   course.appendChild(e);plats.push({x,y,w,h:18});
 });
 startY=plats[0].y-74;
 // Treasure chest is visible at the summit from the beginning.
 const top=plats[plats.length-1];
 chest=document.createElement('div');chest.id='summitChest';chest.innerHTML='💰🧰💰';
 chest.style.position='absolute';chest.style.left=(top.x+top.w/2-52)+'px';chest.style.top=(top.y-70)+'px';
 chest.style.fontSize='42px';chest.style.zIndex='20';chest.style.textAlign='center';chest.style.animation='floatChest 1.4s ease-in-out infinite alternate';
 course.appendChild(chest);
}
function setup(){
 px=plats[0].x+plats[0].w/2-23;py=startY;vx=vy=0;
 bx=plats[0].x+plats[0].w/2+5;by=startY;bvx=bvy=0;cam=0;botProgress=0;
 p.style.left=px+'px';p.style.top=py+'px';b.style.left=bx+'px';b.style.top=by+'px';
 p.style.display='block';b.style.display=mode===1?'block':'block';
 p.style.background=p1Name==='Sylvia'?'#ff75b9':'#9a70ff';
 b.style.background=p2Name==='Sylvia'?'#ff75b9':'#9a70ff';
 document.getElementById('tip').innerHTML=mode===2?'PLAYER 1: WASD • PLAYER 2: ARROW KEYS • W / ↑ = jump':'← → / A D = run • ↑ / W / pink button = jump • You must line up each jump!';
}
function countdown(){
 count.style.display='flex';let n=3;count.textContent=n;
 let t=setInterval(()=>{n--;if(n>0)count.textContent=n;else if(n===0)count.textContent='GO!';else{clearInterval(t);count.style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)}},650);
}
function jumpPower(){return -11.6}
function groundFor(x,y){
  const feet=y+74;
  for(const q of plats){
    if(x+40>q.x+3 && x+6<q.x+q.w-3 && Math.abs(feet-q.y)<7) return q;
  }
  return null;
}
function landOnPlatforms(x,y,oldY,falling){
  if(!falling) return null;
  const oldFeet=oldY+74, newFeet=y+74;
  let best=null;
  for(const q of plats){
    // Only land when the feet actually CROSS the platform top while falling.
    if(oldFeet<=q.y && newFeet>=q.y && x+40>q.x+2 && x+6<q.x+q.w-2){
      if(!best || q.y<best.y) best=q;
    }
  }
  return best;
}
function resetChar(which){
 if(which===1){px=plats[0].x+plats[0].w/2-23;py=startY;vx=vy=0}
 else {bx=plats[0].x+plats[0].w/2+5;by=startY;bvx=bvy=0;botProgress=0}
}
function loop(t){
 if(!running)return;
 const dt=Math.min((t-last)/16.67,1.5);last=t;
 const Ht=window.innerHeight;

 // -------- PLAYER 1 --------
 const oldPy=py;
 let l1=keys.a||(mode===1&&keys.ArrowLeft), r1=keys.d||(mode===1&&keys.ArrowRight);
 let grounded1=!!groundFor(px,py);
 if(l1)vx-=.42*dt;
 if(r1)vx+=.42*dt;
 vx*=Math.pow(.86,dt); vx=Math.max(-6.0,Math.min(6.0,vx));
 let jumpPressed1=keys.w||(mode===1&&keys.ArrowUp)||keys[' ']||jump1;
 if(jumpPressed1 && grounded1){
   vy=jumpPower(); jump1=false; keys.w=keys.ArrowUp=keys[' ']=false;
 }
 vy+=.55*dt; px+=vx*dt; py+=vy*dt;
 const landed1=landOnPlatforms(px,py,oldPy,vy>=0);
 if(landed1){py=landed1.y-74;vy=0}

 // -------- PLAYER 2 / BOT --------
 const oldBy=by;
 if(mode===2){
   let l2=keys.ArrowLeft,r2=keys.ArrowRight,j2=keys.ArrowUp||keys['/']||jump2;
   let grounded2=!!groundFor(bx,by);
   if(l2)bvx-=.42*dt;if(r2)bvx+=.42*dt;
   bvx*=Math.pow(.86,dt);bvx=Math.max(-6.0,Math.min(6.0,bvx));
   if(j2&&grounded2){bvy=jumpPower();jump2=false;keys.ArrowUp=keys['/']=false}
   bvy+=.55*dt;bx+=bvx*dt;by+=bvy*dt;
   const landed2=landOnPlatforms(bx,by,oldBy,bvy>=0);
   if(landed2){by=landed2.y-74;bvy=0}
 }else{
   // Bot is competitive but deliberately slower than a skilled player.
   let targetIndex=Math.min(botProgress+1,plats.length-1), target=plats[targetIndex], tcx=target.x+target.w/2;
   let grounded2=!!groundFor(bx,by);
   if(bx<tcx-18)bvx+=.22*dt; else if(bx>tcx+18)bvx-=.22*dt;
   bvx*=Math.pow(.90,dt);bvx=Math.max(-4.2,Math.min(4.2,bvx));bx+=bvx*dt;
   if(grounded2 && Math.abs(bx-tcx)<75 && Math.random()<.10) bvy=jumpPower();
   bvy+=.55*dt;by+=bvy*dt;
   const landed2=landOnPlatforms(bx,by,oldBy,bvy>=0);
   if(landed2){by=landed2.y-74;bvy=0;if(targetIndex>botProgress)botProgress=targetIndex}
 }

 // Falling off = restart that sister. In 1P this pauses for the player.
 if(py>Ht+50){
   resetChar(1);
   if(mode===1){flash('💫 YOU FELL! 💫','Back to the start! Line up your next jump carefully.');return}
 }
 if(by>Ht+50){resetChar(2)}

 // Camera follows the higher sister, but keeps the platform geometry stable.
 const high=Math.min(py,by);
 if(high<Ht*.34){
   const dy=Ht*.34-high;
   py+=dy;by+=dy;plats.forEach(q=>q.y+=dy);cam+=dy;
 }

 // Finish only when the sister is actually standing on the summit platform.
 const top=plats[plats.length-1];
 const pOnTop=(px+40>top.x+4&&px+6<top.x+top.w-4&&Math.abs((py+74)-top.y)<7);
 const bOnTop=(bx+40>top.x+4&&bx+6<top.x+top.w-4&&Math.abs((by+74)-top.y)<7);
 if(pOnTop){finish(p1Name);return}
 if(bOnTop){finish(p2Name);return}

 p.style.left=px+'px';p.style.top=py+'px';
 b.style.left=bx+'px';b.style.top=by+'px';
 bar.style.width=Math.min(100,Math.max(0,(cam/(plats.length*76))*100))+'%';
 requestAnimationFrame(loop);
}
function H(){return window.innerHeight}
function flash(title,text){
 running=false;msg.style.display='block';msg.innerHTML=`<h1>${title}</h1><p>${text}</p><button onclick="msg.style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)">TRY AGAIN ▶</button>`;
}
function finish(winner){
 running=false;winnerName=winner;bar.style.width='100%';
 // Put a visible treasure chest on the summit.
 const top=plats[plats.length-1];
 const old=document.getElementById('summitChest');if(old)old.remove();
 chest=document.createElement('div');chest.id='summitChest';chest.innerHTML='🧰';chest.style.position='absolute';chest.style.left=(top.x+top.w/2-30)+'px';chest.style.top=(top.y-72)+'px';chest.style.fontSize='58px';chest.style.zIndex='20';course.appendChild(chest);
 msg.style.display='block';
 msg.innerHTML=`<h1>🏆 YOU WON! 🏆</h1><h2>${winner} MADE IT TO THE TOP!</h2>
 <p>You completed the legendary Mount YAEY obstacle course!</p>
 <div class="big-win">🎉 YOU WON! 🎉</div>
 <p><b>Choose your prize pet:</b></p>
 <button class="choice petbtn" onclick="choosePet('cat')">🐱 PET CAT</button>
 <button class="choice petbtn" onclick="choosePet('dog')">🐶 PET DOG</button>`;
}
function choosePet(pet){
 msg.innerHTML=`<h1>🎉 YOU WON! 🎉</h1><h2>DOLLA IS YOUR NEW ${pet==='cat'?'CAT':'DOG'}! ${pet==='cat'?'🐱':'🐶'}</h2>
 <p>Your prize chest is waiting at the tippie top of Mount YAEY.</p><div class="treasure-big">🧰</div>
 <button onclick="openPrize('${pet}')">OPEN THE TREASURE CHEST 💰</button>`;
}
function openPrize(pet){
 msg.innerHTML=`<h1>💰 1 TRILLION DOLLARS! 💰</h1>
 <div class="treasure-big">💰🧰💰</div>
 <p>You got <b>1 TRILLION DOLLARS</b> and Dolla, your new pet ${pet}! ${pet==='cat'?'🐱':'🐶'}</p>
 <p>You are officially the next Sisty sister to conquer Mount YAEY!</p><h2>THE END 🎉</h2>
 <button onclick="location.reload()">PLAY AGAIN 🔄</button>`;
}
window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});
window.addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('.ctrl').forEach(btn=>{
 const k=btn.dataset.k;
 btn.addEventListener('pointerdown',e=>{e.preventDefault();if(k===' '){jump1=true}else keys[k]=true});
 btn.addEventListener('pointerup',()=>{keys[k]=false});btn.addEventListener('pointerleave',()=>{keys[k]=false});btn.addEventListener('pointercancel',()=>{keys[k]=false});
});
showIntro();

</script>
</body>
</html>
